name: WeCom Test

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Optional custom test message"
        required: false
        default: "GitHub Actions WeCom test from zero-cost-news-monitor."
        type: string

permissions:
  contents: read

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      REQUEST_TIMEOUT_SECONDS: 20
      WECOM_MESSAGE_FORMAT: text
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send WeCom test message
        run: python -m scripts.test_wecom --message "${{ inputs.message }}"
