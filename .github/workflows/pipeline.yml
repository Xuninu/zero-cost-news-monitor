name: Pipeline

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap the cache/database without sending urgent alerts"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: news-monitor-pipeline
      cancel-in-progress: false
    env:
      NEWS_DB_PATH: data/news_monitor.db
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT_SECONDS: 20
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      WECOM_MESSAGE_FORMAT: text
      URGENT_THRESHOLD: 9999
      TITLE_SIMILARITY_THRESHOLD: 0.92
      PIPELINE_SCHEDULE_TIMEZONE: Asia/Shanghai
      PIPELINE_SCHEDULE_GRACE_MINUTES: 30
      MAX_DIGEST_ITEMS: 8
      YOUTUBE_VERIFY_TOKEN: ${{ secrets.YOUTUBE_VERIFY_TOKEN }}
      YOUTUBE_WEBHOOK_SECRET: ${{ secrets.YOUTUBE_WEBHOOK_SECRET }}
      YOUTUBE_WEBHOOK_CALLBACK_URL: ${{ secrets.YOUTUBE_WEBHOOK_CALLBACK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare runtime directories
        run: mkdir -p data logs

      - name: Restore SQLite cache
        uses: actions/cache/restore@v4
        with:
          path: data/news_monitor.db
          key: news-monitor-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            news-monitor-db-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check Beijing delivery window
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bootstrap }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "should_send_digest=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "should_send_digest=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from jobs.schedule_utils import is_scheduled_run_due

          due = is_scheduled_run_due()
          print(f"should_run={'true' if due else 'false'}")
          print(f"should_send_digest={'true' if due else 'false'}")
          PY
          fi

      - name: Run pipeline in approved window
        if: ${{ steps.schedule.outputs.should_run == 'true' }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bootstrap }}" == "true" ]]; then
            python -m jobs.run_pipeline --force --bootstrap
          else
            python -m jobs.run_pipeline --force
          fi

      - name: Send digest using the same SQLite state
        if: ${{ steps.schedule.outputs.should_send_digest == 'true' }}
        shell: bash
        run: python -m jobs.send_digest --force

      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news_monitor.db
          key: news-monitor-db-${{ github.ref_name }}-${{ github.run_id }}
