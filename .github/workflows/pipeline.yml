name: Pipeline

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap the cache/database without sending urgent alerts"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: news-monitor-pipeline
      cancel-in-progress: false
    env:
      NEWS_DB_PATH: data/news_monitor.db
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT_SECONDS: 20
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      WECOM_MESSAGE_FORMAT: markdown
      URGENT_THRESHOLD: 80
      TITLE_SIMILARITY_THRESHOLD: 0.92
      PIPELINE_SCHEDULE_TIMEZONE: America/Los_Angeles
      MAX_DIGEST_ITEMS: 25
      YOUTUBE_VERIFY_TOKEN: ${{ secrets.YOUTUBE_VERIFY_TOKEN }}
      YOUTUBE_WEBHOOK_SECRET: ${{ secrets.YOUTUBE_WEBHOOK_SECRET }}
      YOUTUBE_WEBHOOK_CALLBACK_URL: ${{ secrets.YOUTUBE_WEBHOOK_CALLBACK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare runtime directories
        run: mkdir -p data logs

      - name: Restore SQLite cache
        uses: actions/cache/restore@v4
        with:
          path: data/news_monitor.db
          key: news-monitor-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            news-monitor-db-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pipeline with schedule gating
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bootstrap }}" == "true" ]]; then
            python -m jobs.run_pipeline --force --bootstrap
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python -m jobs.run_pipeline --force
          else
            python -m jobs.run_pipeline --scheduled
          fi

      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news_monitor.db
          key: news-monitor-db-${{ github.ref_name }}-${{ github.run_id }}
